name: Contributor and source-check tests
on:
  push:
    branches: [main]
    paths: ['automation/**', 'setup.py', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['automation/**', 'setup.py', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s automation/tests -v
      - run: python3 -I -m unittest discover -s tests -v
