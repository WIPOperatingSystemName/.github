name: Distro integration

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a source-reviewed bundle, or merge a manually approved bundle
        type: choice
        options: [prepare, merge]
        default: prepare
        required: true
      pull_requests:
        description: For prepare, comma-separated PRs (telorgon#42,file-explorer#18,settings#9)
        type: string
      integration_pr:
        description: For merge, the approved distro integration PR number
        type: string

permissions:
  contents: read

env:
  INTEGRATION_ENABLED: ${{ vars.INTEGRATION_ENABLED }}
  AUTO_MERGE_ENABLED: ${{ vars.AUTO_MERGE_ENABLED }}
  MAINTAINER_LOGIN: ${{ vars.MAINTAINER_LOGIN }}

concurrency:
  group: distro-integration
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare bundle
    if: >-
      (inputs.operation == 'prepare' || (github.event_name == 'schedule' && vars.AUTO_MERGE_ENABLED == 'true')) &&
      vars.INTEGRATION_ENABLED == 'true' &&
      github.actor == vars.MAINTAINER_LOGIN && github.triggering_actor == vars.MAINTAINER_LOGIN &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: integration-control
    timeout-minutes: 10
    outputs:
      hub_pr: ${{ steps.prepare.outputs.hub_pr }}
      hub_head: ${{ steps.prepare.outputs.hub_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create immutable integration PR
        id: prepare
        env:
          PR_REFERENCES: ${{ inputs.pull_requests }}
          INTEGRATION_APP_ID: ${{ vars.INTEGRATION_APP_ID }}
          INTEGRATION_INSTALLATION_ID: ${{ vars.INTEGRATION_INSTALLATION_ID }}
          INTEGRATION_APP_PRIVATE_KEY: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python3 -I automation/controller.py prepare-auto
          else
            python3 -I automation/controller.py prepare
          fi

  checks:
    name: Lightweight source checks
    needs: prepare
    if: needs.prepare.outputs.hub_pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable inputs and parse source without executing it
        env:
          HUB_PR: ${{ needs.prepare.outputs.hub_pr }}
          HUB_HEAD: ${{ needs.prepare.outputs.hub_head }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I automation/static_checks.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checked-source
          path: |
            checked-source.json
            static-checks.json
          if-no-files-found: error
          retention-days: 7

  security:
    name: OpenAI source review
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    environment: openai-review
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: checked-source
      - name: Review security and correctness in one bounded API request
        env:
          HUB_PR: ${{ needs.prepare.outputs.hub_pr }}
          HUB_HEAD: ${{ needs.prepare.outputs.hub_head }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_AUTH_MODE: ${{ vars.OPENAI_AUTH_MODE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 -I automation/security_review.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: security-review
          path: security-review.json
          if-no-files-found: warn
          retention-days: 7

  deny:
    name: Record source denial
    needs: [prepare, checks, security]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.hub_pr != '' &&
      (needs.checks.result == 'failure' || needs.security.result == 'failure')
    runs-on: ubuntu-24.04
    environment: integration-control
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish failed trusted status for exact rejected commits
        env:
          HUB_PR: ${{ needs.prepare.outputs.hub_pr }}
          HUB_HEAD: ${{ needs.prepare.outputs.hub_head }}
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_APP_ID: ${{ vars.INTEGRATION_APP_ID }}
          INTEGRATION_INSTALLATION_ID: ${{ vars.INTEGRATION_INSTALLATION_ID }}
          INTEGRATION_APP_PRIVATE_KEY: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
        run: python3 -I automation/controller.py deny

  record:
    name: Record review and checks
    needs: [prepare, checks, security]
    runs-on: ubuntu-24.04
    environment: integration-control
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: checked-source
          path: checks-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: security-review
          path: security-artifact
      - name: Record source-only acceptance against exact commits
        env:
          HUB_PR: ${{ needs.prepare.outputs.hub_pr }}
          HUB_HEAD: ${{ needs.prepare.outputs.hub_head }}
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_APP_ID: ${{ vars.INTEGRATION_APP_ID }}
          INTEGRATION_INSTALLATION_ID: ${{ vars.INTEGRATION_INSTALLATION_ID }}
          INTEGRATION_APP_PRIVATE_KEY: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
        run: |
          cp checks-artifact/static-checks.json static-checks.json
          cp security-artifact/security-review.json security-review.json
          python3 -I automation/controller.py record

  auto-merge:
    name: Merge source-reviewed bundle
    needs: [prepare, checks, security, record]
    if: vars.AUTO_MERGE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: integration-control
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify trusted source review and static checks, then merge exact commits
        env:
          HUB_PR: ${{ needs.prepare.outputs.hub_pr }}
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_APP_ID: ${{ vars.INTEGRATION_APP_ID }}
          INTEGRATION_INSTALLATION_ID: ${{ vars.INTEGRATION_INSTALLATION_ID }}
          INTEGRATION_APP_PRIVATE_KEY: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
        run: python3 -I automation/controller.py merge-auto

  merge:
    name: Merge approved bundle
    if: >-
      inputs.operation == 'merge' && vars.INTEGRATION_ENABLED == 'true' &&
      github.actor == vars.MAINTAINER_LOGIN && github.triggering_actor == vars.MAINTAINER_LOGIN &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: integration-control
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    concurrency:
      group: distro-maintainer-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify maintainer approval and merge exact commits
        env:
          HUB_PR: ${{ inputs.integration_pr }}
          GITHUB_TOKEN: ${{ github.token }}
          INTEGRATION_APP_ID: ${{ vars.INTEGRATION_APP_ID }}
          INTEGRATION_INSTALLATION_ID: ${{ vars.INTEGRATION_INSTALLATION_ID }}
          INTEGRATION_APP_PRIVATE_KEY: ${{ secrets.INTEGRATION_APP_PRIVATE_KEY }}
        run: python3 -I automation/controller.py merge
