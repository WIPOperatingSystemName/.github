name: Request distro integration

on:
  workflow_call:
    secrets:
      INTEGRATION_DISPATCH_TOKEN:
        required: true

permissions: {}

jobs:
  request:
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["WIPOperatingSystemName/distro","WIPOperatingSystemName/telorgon","WIPOperatingSystemName/bootloader","WIPOperatingSystemName/shell","WIPOperatingSystemName/file-explorer","WIPOperatingSystemName/settings","WIPOperatingSystemName/portal-picker"]'), github.repository) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      !(github.repository == 'WIPOperatingSystemName/distro' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'integration/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout or PR data: only request a scan of live canonical PRs.
      - name: Wake the trusted integration controller
        env:
          GH_TOKEN: ${{ secrets.INTEGRATION_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure INTEGRATION_DISPATCH_TOKEN as described in .github/automation/README.md"
            exit 1
          fi
          gh workflow run integration.yml --repo WIPOperatingSystemName/.github --ref main --field operation=scan
